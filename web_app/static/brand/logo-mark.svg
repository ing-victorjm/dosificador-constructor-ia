<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Constructor IA">
  <defs>
    <linearGradient id="edge" x1="152" y1="136" x2="360" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="faceTop" x1="256" y1="136" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="152" y1="196" x2="256" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="360" y1="196" x2="256" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="#05070d"/>
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="111.25" fill="none" stroke="#1b2436" stroke-width="1.5"/>

  <!-- Caras del cubo isométrico (módulo constructivo) -->
  <path d="M256 136 L360 196 L256 256 L152 196 Z" fill="url(#faceTop)"/>
  <path d="M152 196 L256 256 L256 376 L152 316 Z" fill="url(#faceLeft)"/>
  <path d="M360 196 L360 316 L256 376 L256 256 Z" fill="url(#faceRight)"/>

  <g filter="url(#glow)">
    <!-- Hexágono exterior -->
    <path d="M256 136 L360 196 L360 316 L256 376 L152 316 L152 196 Z"
          fill="none" stroke="url(#edge)" stroke-width="5" stroke-linejoin="round"/>
    <!-- Aristas internas (Y del cubo) -->
    <path d="M256 256 L256 136 M256 256 L152 316 M256 256 L360 316"
          fill="none" stroke="url(#edge)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Trazas de circuito saliendo de los vértices -->
    <path d="M360 196 L402 172 M256 376 L256 424 M152 196 L110 172"
          fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Nodos de circuito en las puntas -->
  <g fill="#0a0e1a" stroke="#22d3ee" stroke-width="3">
    <circle cx="402" cy="172" r="7"/>
    <circle cx="110" cy="172" r="7"/>
    <circle cx="256" cy="424" r="7"/>
  </g>

  <!-- Núcleo: chispa de inteligencia -->
  <circle cx="256" cy="256" r="34" fill="url(#spark)"/>
  <circle cx="256" cy="256" r="10" fill="#ede9fe"/>
</svg>
