<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f7;
      font-family: "Segoe UI", sans-serif; }
    #host { position: absolute; inset: 0; }
    #hint { position: absolute; left: 10px; bottom: 8px; color: #6b7280;
      font-size: 11px; background: rgba(255,255,255,0.62); padding: 3px 8px;
      border-radius: 6px; pointer-events: none; backdrop-filter: blur(4px); }
    #elem-label {
      position: absolute; left: 10px; top: 8px; color: #374151;
      font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,0.72); padding: 3px 10px;
      border-radius: 6px; pointer-events: none; display: none;
      backdrop-filter: blur(4px);
    }
    #controls {
      position: absolute; right: 8px; top: 8px;
      display: flex; flex-direction: column; gap: 5px;
    }
    #controls button {
      width: 30px; height: 30px; border: 1px solid rgba(0,0,0,0.10);
      border-radius: 7px; background: rgba(255,255,255,0.78);
      cursor: pointer; font-size: 15px; color: #555;
      display: flex; align-items: center; justify-content: center;
      padding: 0; backdrop-filter: blur(4px); transition: background 0.15s;
    }
    #controls button:hover { background: rgba(255,255,255,0.95); color: #222; }
    #controls button.active { background: rgba(108,60,224,0.15); color: #6C3CE0;
      border-color: rgba(108,60,224,0.3); }
  </style>
</head>
<body>
  <div id="host"></div>
  <div id="elem-label"></div>
  <div id="controls">
    <button id="btn-reset" title="Reiniciar camara">⟳</button>
    <button id="btn-wire" title="Ver aristas">⬜</button>
    <button id="btn-rotate" title="Auto-rotar">↻</button>
  </div>
  <div id="hint">Arrastra · zoom · pellizca</div>
  <script src="vendor/three.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
